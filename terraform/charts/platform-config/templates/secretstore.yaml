# One store for the whole cluster. ESO authenticates with its own Pod Identity
# role, which can only read secrets named "{{ .Values.secretPrefix }}/*".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.grafana.namespace }}
---
# Grafana admin login, sourced from Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafana.adminSecretName }}
  namespace: {{ .Values.grafana.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore.name }}
  target:
    name: {{ .Values.grafana.adminSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.secretPrefix }}/grafana/admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.secretPrefix }}/grafana/admin
        property: password
