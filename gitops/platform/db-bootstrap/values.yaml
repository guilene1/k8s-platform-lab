# Every app that gets a database + user. The credentials themselves are in
# AWS Secrets Manager (<prefix>/apps/<app>/db), created by Terraform.
apps:
  - shopline
  - northbank
  - quickplate
  - staywell
  - homefinder
  - hirehub
  - careslot
  - ticketwave
  - fittrack
  - drivenow

image: postgres:18.6-alpine3.24

# `global` is injected by Terraform via the root Argo CD Application.
global: {}
