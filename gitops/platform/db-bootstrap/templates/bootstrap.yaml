{{- $g := .Values.global -}}
# Master credential + every app's credential, from Secrets Manager.
# Sync wave 0: exists (and is synced) before the Job in wave 1 runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "global.secretStore is required" $g.secretStore }}
  target:
    name: db-bootstrap
    creationPolicy: Owner
  data:
    {{- range $key, $prop := dict "PGHOST" "host" "PGPORT" "port" "PGUSER" "username" "PGPASSWORD" "password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $g.secretPrefix }}/rds/master
        property: {{ $prop }}
    {{- end }}
    {{- range $app := .Values.apps }}
    {{- range $prop := list "username" "password" }}
    - secretKey: {{ $app }}_{{ $prop }}
      remoteRef:
        key: {{ $g.secretPrefix }}/apps/{{ $app }}/db
        property: {{ $prop }}
    {{- end }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-bootstrap-script
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  bootstrap.sh: |
    {{- .Files.Get "files/bootstrap.sh" | nindent 4 }}
---
# Runs on every sync of this app (Argo CD Sync hook). The previous run's Job
# is kept for inspection until the next sync replaces it.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap
        app.kubernetes.io/part-of: k8s-platform-lab
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # "postgres" in the official alpine image
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.image }}
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            - name: APPS
              value: {{ join " " .Values.apps | quote }}
            - name: PGDATABASE
              value: postgres
            # RDS enforces TLS. (The app containers additionally verify the
            # server certificate against the bundled RDS CA.)
            - name: PGSSLMODE
              value: require
          envFrom:
            - secretRef:
                name: db-bootstrap
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: db-bootstrap-script
        - name: tmp
          emptyDir: {}
