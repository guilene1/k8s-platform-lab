# The apps Argo CD deploys. Each entry becomes an Application named after the
# key, deploying the Helm chart at `path` into the namespace of the same name
# (or `namespace`). Set `enabled: false` to remove an app (Argo CD prunes it).
#
# `global` is injected by Terraform through the root Application (domain, ECR
# registry, image tags, ...). Do not set it here.
apps:
  # Creates the 10 databases + users on RDS before the apps need them.
  db-bootstrap:
    path: gitops/platform/db-bootstrap
    syncWave: "-1"

  shopline:
    path: gitops/apps/shopline
  northbank:
    path: gitops/apps/northbank
  quickplate:
    path: gitops/apps/quickplate
  staywell:
    path: gitops/apps/staywell
  homefinder:
    path: gitops/apps/homefinder
  hirehub:
    path: gitops/apps/hirehub
  careslot:
    path: gitops/apps/careslot
  ticketwave:
    path: gitops/apps/ticketwave
  fittrack:
    path: gitops/apps/fittrack
  drivenow:
    path: gitops/apps/drivenow

global: {}
